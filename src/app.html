<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// The remembered theme before first paint, so no page flashes the other one. The layout
			// effect takes over once the app is live (src/routes/+layout.svelte).
			(() => {
				let t = 'system';
				try {
					t = localStorage.getItem('aster:theme') || 'system';
				} catch {}
				if (t !== 'light' && t !== 'dark' && t !== 'high-contrast')
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = t;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
