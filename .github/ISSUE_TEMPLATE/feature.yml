name: Feature
description: Something Aster should do. Check the roadmap in the README first; M2 and M3 items are already planned.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where it got slow or impossible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
    validations:
      required: true
  - type: input
    id: staruml
    attributes:
      label: How StarUML does it, if it does
      placeholder: "Menu / key in StarUML, or 'StarUML has no equivalent'"
